name: Atualizar badges do Homelab

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-badges
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Renovar URLs das badges
        run: |
          python3 <<'PY'
          import re
          import time
          from pathlib import Path

          arquivo = Path("README.md")
          texto = arquivo.read_text(encoding="utf-8")
          versao = str(int(time.time()))

          def atualizar(match):
              url = match.group(0)
              url = re.sub(r"([?&])v=[^&]*", r"\1v=" + versao, url)
              if not re.search(r"[?&]v=", url):
                  url += ("&" if "?" in url else "?") + "v=" + versao
              return url

          texto = re.sub(
              r'https://status\.amararquitetura\.com\.br/api/badge/[^\s)"<>]+',
              atualizar,
              texto,
          )
          arquivo.write_text(texto, encoding="utf-8")
          PY

      - name: Salvar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza cache das badges"
            git push
          fi
